name: Verify certificate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out certificate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run rejection tests and full certificate
        run: |
          docker run --rm --user 0:0 \
            --volume "$PWD:/work" --workdir /work \
            --env DOT_SAGE=/tmp/sage \
            --entrypoint /bin/bash \
            sagemath/sagemath:10.8@sha256:e2e4747b0e1ea8753a9cb5a399314a8b2c25fcefaf69ba85b22ee075829d09ea \
            -euc 'sage -python F2_human_audit/test_certificate.py; python3 verify.py'
      - name: Save verification report and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-report
          path: .audit/verification.*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
